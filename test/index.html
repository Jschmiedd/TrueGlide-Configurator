<!doctype html>

        <!-- TrueGlide (audit du 06/11/2026) : scripts, polices et cadres seulement depuis ce site ; aucun script extérieur ni
             script inline. 'unsafe-eval' : Vue compile au démarrage le modèle de <app> (Function), sans lui la page reste blanche. -->

        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />


        <title>TrueGlide Configurator</title>

            name="description"

        />
