<!doctype html>
<html lang="en" translate="no">
    <head>
        <meta name="google" content="notranslate" />
        <!-- TrueGlide (audit du 06/11/2026) : scripts, polices et cadres seulement depuis ce site ; aucun script extérieur ni
             script inline. 'unsafe-eval' : Vue compile au démarrage le modèle de <app> (Function), sans lui la page reste blanche. -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws: blob: data:; worker-src 'self' blob:; frame-src 'self' https://jschmiedd.github.io; media-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

        <script type="module" src="/src/js/utils/common.js"></script>
        <script type="module" src="/src/js/browserMain.js"></script>

        <title>TrueGlide Configurator</title>
        <meta
            name="description"
            content="Configuration and management tool for the Betaflight flight control firmware"
        />
        <link rel="icon" href="/images/pwa/favicon.ico" />
        <link rel="apple-touch-icon" href="/images/pwa/apple-touch-icon.png" sizes="128x128" />
        <meta name="theme-color" content="#eea600" />
    </head>
    <body>
        <!-- Every dialog lives in Vue now (see src/components/dialogs). Do not add markup after
             <app></app>: it would be parsed as slot content and dropped, since App.vue has no slot. -->
        <div id="main-wrapper">
            <app></app>
        </div>
    </body>
</html>
